# Deploys the static app to GitHub Pages (HTTPS). No secrets are stored anywhere:
# the job uses GitHub's short-lived OIDC/GITHUB_TOKEN, minted per run and never saved.
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/make-icons.py
      - run: mkdir _site && cp -r index.html sw.js styles.css manifest.webmanifest icons src _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
